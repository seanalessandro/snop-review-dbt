version: 2

models:
  - name: stg_edi_m_price_divisi
    description: Year-and-channel SKU price master used by SALFO VALUE.
    columns:
      - name: divisi
        tests:
          - not_null
          - accepted_values:
              values: ['GT', 'MT']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [pcode, divisi, year]

  - name: stg_edi_m_acc_div
    description: Valid account-to-SBU mapping used to classify FDOS as GT or MT.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [acc_id, div_id]

  - name: stg_edi_m_distributor
    description: Distributor channel mapping restricted to GT and MT.
    columns:
      - name: divisi
        tests:
          - not_null
          - accepted_values:
              values: ['GT', 'MT']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ct_id, distributor_id]

  - name: stg_edi_t_fdos_h
    description: Processed FDOS Plan source; final value is qty_adj.

  - name: stg_edi_t_fdis_confirm_update
    description: Processed FDIS Confirm Update source with day1-day6 normalized to qty.
